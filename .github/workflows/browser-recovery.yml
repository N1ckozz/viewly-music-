name: Viewly browser and recovery checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline backup and restore
        run: python scripts/backup.py self-test
      - name: Install Chromium and FFmpeg
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Start isolated application and test responsive navigation
        run: |
          export PORT=4179 APP_URL=http://127.0.0.1:4179
          export VIEWLY_DATA_DIR="$RUNNER_TEMP/viewly-browser/data"
          export VIEWLY_UPLOAD_DIR="$RUNNER_TEMP/viewly-browser/uploads"
          node server.js > "$RUNNER_TEMP/viewly-browser.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for n in $(seq 1 60); do
            if curl -fsS "$APP_URL/api/health" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$APP_URL/api/health"
          VIEWLY_BROWSER_URL="$APP_URL" VIEWLY_SCREENSHOT_DIR=browser-results/local python scripts/browser-smoke.py
      - name: Check public V12 staging in Chromium
        run: VIEWLY_BROWSER_URL=https://viewly-web-staging.up.railway.app VIEWLY_SCREENSHOT_DIR=browser-results/live python scripts/browser-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewly-browser-screenshots
          path: browser-results/
          retention-days: 7
