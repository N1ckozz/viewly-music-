name: Viewly checks
on:
  push:
    branches: [main, redesign/viewly-studio-v4, security/hardening-nov2026]
  pull_request:
    branches: [main, redesign/viewly-studio-v4]
permissions:
  contents: read
jobs:
  lint-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install video test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Validate source syntax
        run: |
          node --check server.js
          node --check public/app.js
          node --check public/stage.js
          node --check public/experience.js
          node --check public/v4.js
          node --check public/v4.motion.js
          node --check public/v5.js
          node --check public/v6.js
          node --check public/v6.motion.js
          node --check public/security.js
          node --check mfa.js
          node --check public/mfa-ui.js
          node --check public/v7.js
          node --check admin-core.js
          node --check auth-mail.js
          node --check public/admin-ui.js
          node --check public/auth-ui.js
          node --check billing-core.js
          node --check sandbox-campaigns.js
          node --check social-oauth.js
          node --check creator-campaigns.js
          node --check cpm-watchdog.js
          node --check analytics-core.js
          node --check workspace-core.js
          node --check public/v13.js
          node --check promotions-core.js
          node --check public/v14.js
          node --check public/v11.js
          node --check public/v10.js
          node --check public/billing-ui.js
          node --check scripts/provision-admin.js
      - name: Real backend integration tests
        run: npm test
