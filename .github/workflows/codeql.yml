name: Viewly CodeQL security analysis
on:
  push:
    branches: [main, redesign/viewly-studio-v4, security/hardening-nov2026]
  pull_request:
    branches: [main, redesign/viewly-studio-v4]
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    name: Static analysis - JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
